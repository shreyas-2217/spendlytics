[project]
name = "spendlytics"
version = "0.1.0"
description = "Turn a UPI statement into a clean spending dashboard, with an AI copilot that answers plain-English questions about your money."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
